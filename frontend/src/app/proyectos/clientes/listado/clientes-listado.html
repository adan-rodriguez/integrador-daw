<dialog [(open)]="visible">
  <div class="content">
    <button class="close-btn" type="button" title="Cerrar" (click)="cerrarModal()">❌</button>
    <h1>Clientes</h1>
    <button (click)="crearCliente()">Crear cliente</button>
    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (cliente of clientes(); track cliente.id) {
          <tr>
            <td>{{ cliente.nombre }}</td>
            <td>{{ cliente.estado }}</td>
            <td>
              <button (click)="editarCliente(cliente)">✏</button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="3">No se encontraron clientes.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</dialog>
<app-gestion-cliente
  [(visible)]="dialogVisible"
  [(clienteSeleccionado)]="clienteSeleccionado"
></app-gestion-cliente>
