<app-template>
  <button (click)="crearProyecto()">Crear proyecto</button>
  <table>
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Cliente</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for (proyecto of proyectos(); track proyecto.id) {
        <tr>
          <td>{{ proyecto.nombre }}</td>
          <td>{{ proyecto.cliente?.nombre ?? '' }}</td>
          <td>{{ proyecto.estado }}</td>
          <td>
            <a routerLink="/proyectos/{{ proyecto.id }}/tareas">⚙</a>
            <button title="Editar Proyecto" (click)="editarProyecto(proyecto)">✏</button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="4">No se encontraron proyectos.</td>
        </tr>
      }
    </tbody>
  </table>
  <app-gestion-proyecto
    [(visible)]="dialogVisible"
    [(proyectoSeleccionado)]="proyectoSeleccionado"
  ></app-gestion-proyecto>
</app-template>
