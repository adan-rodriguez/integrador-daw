<dialog [open]="visible()">
  <form [formGroup]="form" (ngSubmit)="guardarTarea()">
    <h1>{{ tareaSeleccionada() ? 'Editar tarea' : 'Crear tarea' }}</h1>
    <input type="text" placeholder="Descripción" formControlName="descripcion" />

    @if (tareaSeleccionada()) {
      <select formControlName="estado">
        @for (estado of estados; track estado) {
          <option value="{{ estado }}">{{ estado }}</option>
        }
      </select>
    }
    <button type="submit" [disabled]="!form.valid">Guardar</button>
    <button type="button" (click)="cerrarDialog()">Cancelar</button>
  </form>
</dialog>
